[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-performance-hub"
version = "1.0.0"
description = "Automated sales performance reporting: data quality, back-tested forecasting, explainable target setting and weighted scorecards."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "statsmodels>=0.14",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "sqlglot>=25",
  "streamlit>=1.38",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fph = ["settings.yaml", "sql/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning"]
