name: monthly-close

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 2 * *"   # 03:17 UTC on the 2nd of every month = automated month-end close
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit, data-quality and dashboard tests
        run: pytest -q
      - name: Run monthly pipeline (fails on any CRITICAL data-quality check)
        run: python -m fph.pipeline run
      - name: Check BigQuery SQL still transpiles
        run: python -m fph.warehouse --to-bigquery
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-pack
          path: |
            exports/*.xlsx
            exports/insights.md
            exports/run_manifest.json
            exports/bi/
